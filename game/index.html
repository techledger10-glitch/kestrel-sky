<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Sky — a low-poly flight game over the Alder Isles</title>
<meta name="description" content="Kestrel Sky: fly the Alder Isles at golden hour. Gates, survey passes and one long landing, graded on throttle and turn discipline.">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #12181d;
    font-family: "Inter", "Helvetica Neue", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #world { z-index: 0; }
  #hud { z-index: 1; pointer-events: none; }
  #overlay { z-index: 2; pointer-events: none; }
  /* The loading card, until the first frame lands. */
  #boot {
    position: absolute; inset: 0; z-index: 4;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: #12181d; color: #e8f1f4;
    transition: opacity 420ms ease; letter-spacing: 0.24em; font-size: 11px;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot strong { font-size: 30px; letter-spacing: 0.04em; font-weight: 800; }
  #boot span { color: #7ee0ec; }
  #error { position: absolute; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center;
    padding: 40px; background: #12181d; color: #ffb3a0; font-size: 14px; text-align: center; line-height: 1.6; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="world" aria-label="Kestrel Sky: a 3D flight game over the Alder Isles. Fly through gates, pass over survey markers and land on the runway."></canvas>
  <canvas id="hud" aria-hidden="true"></canvas>
  <canvas id="overlay" aria-hidden="true"></canvas>
  <div id="boot"><strong>KESTREL SKY</strong><span>loading the Alder Isles…</span></div>
  <div id="error"></div>
  <p id="status" role="status" aria-live="polite"></p>
</div>
<script type="module" src="./src/main.js"></script>
<script>
  // If the game cannot start at all (no WebGL2 here), say so plainly instead of showing a black page.
  window.addEventListener('error', (event) => {
    const box = document.getElementById('error');
    if (!box || box.style.display === 'flex') return;
    box.style.display = 'flex';
    box.textContent = 'Kestrel Sky needs WebGL2. This browser reported: ' + (event.message || 'an unknown error');
  });
  const boot = document.getElementById('boot');
  const ready = () => setTimeout(() => boot.classList.add('done'), 520);
  if (document.readyState === 'complete') ready();
  else window.addEventListener('load', ready);
  setTimeout(() => boot.classList.add('done'), 4000);
</script>
</body>
</html>
